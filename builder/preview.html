<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Preview</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Clearface','Clearface Fallback',Georgia,serif;color:#25282A;background:#FBF9F5;line-height:1.6}
  #top-header{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(0,0,0,.78);color:#fff;display:flex;align-items:center;gap:1rem;padding:0 1.1rem;height:60px;font:700 .8rem Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
  #top-header span{opacity:.6;font-weight:400;letter-spacing:0;text-transform:none}
  main{max-width:820px;margin:0 auto;padding:88px 1.1rem 3rem}
  .hero{height:200px;border-radius:4px;background:linear-gradient(#092A4D,#99ADC5 60%,#E7805D);margin-bottom:1.2rem}
  h1{font-family:'Dharma Gothic E','Dharma Gothic E Fallback','Arial Narrow',Impact,sans-serif;font-weight:700;text-transform:uppercase;font-size:2.2rem;line-height:1.05;margin:.2em 0}
  .bar{height:.8rem;border-radius:2px;background:#e4dfd2;margin:.7rem 0}
  .bar.s{width:62%}.bar.m{width:86%}
  #trpl-float{position:fixed;left:1rem;bottom:1rem;z-index:99999;max-width:22.5rem;background:#FBF9F5;border:1px solid rgba(37,40,42,.2);border-left:6px solid #E7805D;border-radius:4px;box-shadow:0 6px 24px rgba(9,42,77,.25);padding:.9rem 1rem;font-size:.86rem}
  #trpl-float strong{display:block;font-family:'Dharma Gothic E','Dharma Gothic E Fallback','Arial Narrow',Impact,sans-serif;font-weight:700;text-transform:uppercase;font-size:1.15rem;color:#092A4D}
  @media (max-width:600px){#trpl-float{left:.6rem;right:.6rem;bottom:.6rem;max-width:none}}
  button.deyra-chatbot-button{position:fixed;right:var(--deyra-btn-horizontal-offset);bottom:var(--deyra-btn-vertical-offset);z-index:1000;height:66px;width:66px;border-radius:9999px;border:1px solid #404040;background:#99ADC5;color:#092A4D;font:500 11px Arial,sans-serif}
</style>
</head>
<body>
<header id="top-header">Site header <span>stand-in for trlibrary.com</span></header>
<main>
  <div class="hero"></div>
  <h1>Page content</h1>
  <script>
    var w = ["m", "", "s", "", "m", "s"];
    for (var i = 0; i < 60; i++) document.write('<div class="bar ' + w[i % w.length] + '"></div>');
  </script>
</main>
<script src="../popup.js"></script>
<script>
(function () {
  var launcher = null, alertEl = null;
  function neighbours(n) {
    if (n.chat && !launcher) {
      launcher = document.createElement("button");
      launcher.className = "deyra-chatbot-button"; launcher.type = "button";
      launcher.setAttribute("style", "--deyra-btn-vertical-offset: 40px; --deyra-btn-horizontal-offset: 20px;");
      launcher.textContent = "Ask AI";
      document.body.appendChild(launcher);
    } else if (!n.chat && launcher) { launcher.remove(); launcher = null; }
    if (n.alert && !alertEl) {
      alertEl = document.createElement("aside");
      alertEl.id = "trpl-float";
      alertEl.innerHTML = "<strong>Ticket alert</strong>Only 12 tickets left today.";
      document.body.appendChild(alertEl);
    } else if (!n.alert && alertEl) { alertEl.remove(); alertEl = null; }
  }
  window.addEventListener("message", function (e) {
    if (e.origin !== window.location.origin) return;
    var m = e.data || {};
    if (m.type !== "trplpop-preview") return;
    neighbours(m.neighbours || {});
    window.scrollTo(0, 0);
    var err = window.TRPLPopup.preview(m.config);
    parent.postMessage({ type: "trplpop-preview-status", error: err || "" }, window.location.origin);
  });
  ["show", "close"].forEach(function (ev) {
    window.TRPLPopup.on(ev, function (d) { parent.postMessage({ type: "trplpop-preview-event", event: ev, action: d.popup_action }, window.location.origin); });
  });
  parent.postMessage({ type: "trplpop-preview-ready" }, window.location.origin);
})();
</script>
</body>
</html>
