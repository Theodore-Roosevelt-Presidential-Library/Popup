name: Refresh sitemap

on:
  schedule:
    - cron: "17 9 * * *"   # nightly, about 3:17 a.m. Mountain
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch trlibrary.com sitemap
        run: python3 scripts/fetch_sitemap.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/sitemap.json; then
            echo "No change."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sitemap.json
            git commit -m "Refresh sitemap"
            git push
          fi
